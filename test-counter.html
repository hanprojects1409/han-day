<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Counter Test</title>
</head>

<body>

  <h1>HAN DAY Counter Test</h1>

  <button id="test-songs">Add Song</button>
  <button id="test-stars">Add Star</button>
  <button id="test-postcards">Add Postcard</button>

  <pre id="result">Loading...</pre>

  <script>
    const result = document.getElementById("result");

    async function showCounters() {
      try {
        const response = await fetch("/api/counter");
        const data = await response.json();

        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = "Error: " + error.message;
      }
    }

    async function addParticipation(activity) {
      try {
        const response = await fetch("/api/counter", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            activity: activity
          })
        });

        const data = await response.json();

        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = "Error: " + error.message;
      }
    }

    document
      .getElementById("test-songs")
      .addEventListener("click", () => {
        addParticipation("songs");
      });

    document
      .getElementById("test-stars")
      .addEventListener("click", () => {
        addParticipation("stars");
      });

    document
      .getElementById("test-postcards")
      .addEventListener("click", () => {
        addParticipation("postcards");
      });

    showCounters();
  </script>

</body>
</html>
